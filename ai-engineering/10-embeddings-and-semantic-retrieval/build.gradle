plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.ai:spring-ai-transformers'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'postgres', 'live-llm', 'identity', 'embeddings' }; jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.named('bootRun') { jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.named('bootJar') { archiveFileName = 'lesson.jar' }

dependencies { testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' }

tasks.register('embeddingTest', Test) {
    description = 'Opt-in real local embedding retrieval evaluation; no paid model calls.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'embeddings' }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
