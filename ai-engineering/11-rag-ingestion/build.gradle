plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 25 }

dependencies {
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.ai:spring-ai-transformers'
    implementation 'org.springframework.ai:spring-ai-pgvector-store'
    implementation 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'postgres', 'live-llm', 'identity' }; jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.named('bootRun') { jvmArgs '--enable-native-access=ALL-UNNAMED' }
tasks.named('bootJar') { archiveFileName = 'lesson.jar' }

tasks.register('postgresTest', Test) { testClassesDirs = sourceSets.test.output.classesDirs; classpath = sourceSets.test.runtimeClasspath; useJUnitPlatform { includeTags 'postgres' }; jvmArgs '--enable-native-access=ALL-UNNAMED' }

dependencies { testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test' }
