<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI engineering · Lesson chat</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="chat.css"><script src="lesson-config.js" defer></script><script src="chat.js" defer></script></head>
<body><main class="shell"><header><div class="brand"><span class="mark" aria-hidden="true">✳</span> Engineering learning</div><span id="module-number" class="module-badge"></span></header>
<section class="chat-panel" aria-labelledby="lesson-title"><div class="heading"><div><p class="eyebrow">AI ENGINEERING</p><h1 id="lesson-title"></h1><p id="lesson-description" class="description"></p></div><button id="reset" type="button" class="quiet">New chat</button></div>
<div id="controls" class="controls" hidden><label id="provider-label" hidden>Provider <select id="provider" aria-label="Provider"></select></label><label id="token-label" hidden>Access token <input id="access-token" type="password" autocomplete="off" spellcheck="false" placeholder="For this session only"></label><label id="learning-label" hidden><input id="learning-mode" type="checkbox" checked> Show execution steps</label></div>
<div id="messages" class="messages" role="log" aria-label="Conversation" aria-live="polite"><div id="welcome" class="welcome"><span class="welcome-icon" aria-hidden="true">✳</span><h2 id="welcome-title">Let’s try it.</h2><p id="welcome-text"></p><button id="example" class="suggestion" type="button"></button></div></div>
<div id="actions" class="actions" hidden><button id="preview" type="button">Preview chunks</button><button id="ingest" type="button">Rebuild demo index</button><button id="evaluate" type="button">Evaluate retrieval</button></div>
<form id="composer"><label class="sr-only" for="question">Message</label><textarea id="question" rows="1" maxlength="4000" placeholder="Ask a question…" required></textarea><button id="send" type="submit" aria-label="Send message">Send <span aria-hidden="true">↑</span></button></form>
<p id="status" class="status" role="status" aria-live="polite"></p><p id="scope" class="scope"></p></section><footer>One lesson. One idea. <span>Run locally · Credentials stay on the server</span></footer></main></body></html>
